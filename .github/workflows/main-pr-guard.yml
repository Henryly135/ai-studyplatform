name: Main PR Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  only-from-develop:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure only develop can open PRs into main
        run: |
          echo "PR base branch: ${{ github.event.pull_request.base.ref }}"
          echo "PR head branch: ${{ github.event.pull_request.head.ref }}"
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ] && [ "${{ github.event.pull_request.head.ref }}" != "develop" ]; then
            echo "Only pull requests from 'develop' branch are allowed to merge into 'main'."
            echo "Current source branch is '${{ github.event.pull_request.head.ref }}'. Please retarget through develop."
            exit 1
          fi
          echo "Branch policy check passed."
