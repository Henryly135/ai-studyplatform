    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/learning-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../../packages/platform_common

      - name: Import check
        run: python -c "from app.main import app; print('learning-service import ok')"

      - name: Run learning-service tests
        run: pytest tests -q

      - name: Celery task registration check
        run: python -c "import app.tasks.quiz_attempts; from app.core.celery_app import celery_app; assert 'app.tasks.quiz_attempts.auto_submit_quiz_attempt_task' in celery_app.tasks; print('learning-worker celery task ok')"

  ai-service-check:
