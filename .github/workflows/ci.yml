name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_ENV_FILE: .env.ci
  COMPOSE_FILE: infra/docker-compose.yml

jobs:
  conventions:
    name: Commit and PR format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit and PR format
        run: ./scripts/check-git-conventions.sh

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  platform-common:
    name: Shared package tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi
          pip install -e ./packages/platform_common

      - name: Run platform-common tests
        run: pytest packages/platform_common/tests -q

  compose-gate:
    name: Compose, backend tests, gateway smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          COMPOSE_PROJECT_NAME="ai-studyplatform-ci-${{ github.run_id }}" \
            ./scripts/create-ci-env.sh "$CI_ENV_FILE"

      - name: Validate Docker Compose config
        run: docker compose --env-file "$CI_ENV_FILE" -f "$COMPOSE_FILE" config --quiet

      - name: Start full stack
        run: docker compose --env-file "$CI_ENV_FILE" -f "$COMPOSE_FILE" up -d --build

      - name: Show service status
        run: docker compose --env-file "$CI_ENV_FILE" -f "$COMPOSE_FILE" ps -a

      - name: Verify gateway routes
        run: |
          set -euo pipefail
          set -a
          . "./$CI_ENV_FILE"
          set +a

          wait_for_url() {
            url="$1"
            expected="$2"
            for _ in $(seq 1 60); do
              body="$(curl -fsS "$url" 2>/dev/null || true)"
              if [ -n "$body" ] && { [ -z "$expected" ] || printf "%s" "$body" | grep -q "$expected"; }; then
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $url"
            return 1
          }

          wait_for_url "http://127.0.0.1:${NGINX_PORT}/" "<div id=\"root\""
          wait_for_url "http://127.0.0.1:${NGINX_PORT}/api/health" '"status":"ok"'
          wait_for_url "http://127.0.0.1:${NGINX_PORT}/api/ai/health" '"status":"ok"'
          wait_for_url "http://127.0.0.1:${NGINX_PORT}/api/learning/health" '"status":"ok"'
          wait_for_url "http://127.0.0.1:${NGINX_PORT}/api/communication/health" '"status":"ok"'

      - name: Verify internal routes stay blocked
        run: |
          set -euo pipefail
          set -a
          . "./$CI_ENV_FILE"
          set +a

          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${NGINX_PORT}/api/ai/internal/profile-update/context" -H "Content-Type: application/json" -d '{"learnerId":1,"courseUuid":"x","moduleUuid":"y"}')" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${NGINX_PORT}/api/learning/internal/quiz-generation/context" -H "Content-Type: application/json" -d '{"courseUuid":"x","moduleUuid":"y"}')" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${NGINX_PORT}/api/internal/users/lookup" -H "Content-Type: application/json" -d '{"userIds":[1]}')" = "404"

      - name: Run full backend test suites
        run: |
          set -euo pipefail
          for service in identity-service communication-service learning-service ai-service; do
            echo "==> Running pytest for ${service}"
            docker compose --env-file "$CI_ENV_FILE" -f "$COMPOSE_FILE" exec -T "$service" pytest tests -q
          done

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose --env-file "$CI_ENV_FILE" -f "$COMPOSE_FILE" ps -a
          for service in mysql postgres-ai redis redis-quiz minio identity-service communication-service communication-worker learning-service learning-worker ai-service ai-worker frontend nginx; do
            echo "===== ${service} logs ====="
            docker compose --env-file "$CI_ENV_FILE" -f "$COMPOSE_FILE" logs --tail=200 "$service" || true
          done

      - name: Stop stack
        if: always()
        run: docker compose --env-file "$CI_ENV_FILE" -f "$COMPOSE_FILE" down -v --remove-orphans
