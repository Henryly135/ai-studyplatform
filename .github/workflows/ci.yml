name: CI

on:
  push:
    branches:
      - "feature/**"
      - "refactor/**"
      - "fix/**"
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  conventions:
    name: Commit and PR format
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow context
        run: |
          test -n "${GITHUB_SHA}"
          test -n "${GITHUB_REF_NAME}"

  platform-common-check:
    name: Shared package tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi
          pip install -e ./packages/platform_common

      - name: Run platform-common tests
        run: pytest packages/platform_common/tests -q

  frontend-check:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm run audit:ci

  identity-service-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/identity-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e ../../packages/platform_common

      - name: Import check
        run: python -c "from app.main import app; print('identity-service import ok')"

      - name: Run identity-service tests
        run: pytest tests -q

      - name: Celery dispatch wiring check
        run: python -c "from app.core.celery_app import celery_app; print(celery_app.conf.task_default_queue)"

