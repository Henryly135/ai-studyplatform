  db-migrate-identity:
    image: mysql:8.0
    profiles: ["tools"]   # This service is only included when the "tools" profile is activated, e.g. with `docker compose --profile tools run --rm db-migrate-identity`
    environment:
      TZ: ${APP_TIMEZONE}
      MYSQL_DATABASE: ${IDENTITY_DB_NAME}
      MYSQL_USER: ${IDENTITY_DB_USER}
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD}
      MYSQL_INTERNAL_PORT: ${MYSQL_INTERNAL_PORT}
    volumes:
      - ../database/migrations/identity:/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        for f in /migrations/*.sql; do
          echo "Applying $$f";
          mysql -hmysql -P"$$MYSQL_INTERNAL_PORT" -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" < "$$f";
        done

  db-migrate-learning:
    image: mysql:8.0
    profiles: ["tools"]   # This service is only included when the "tools" profile is activated, e.g. with `docker compose --profile tools run --rm db-migrate-learning`
    environment:
      TZ: ${APP_TIMEZONE}
      MYSQL_DATABASE: ${LEARNING_DB_NAME}
      MYSQL_USER: ${LEARNING_DB_USER}
      MYSQL_PASSWORD: ${LEARNING_DB_PASSWORD}
      MYSQL_INTERNAL_PORT: ${MYSQL_INTERNAL_PORT}
    volumes:
      - ../database/migrations/learning:/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        for f in /migrations/*.sql; do
          echo "Applying $$f";
          mysql -hmysql -P"$$MYSQL_INTERNAL_PORT" -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" < "$$f";
        done

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npm ci --prefer-offline --no-audit && npm run build && npm run preview -- --host 0.0.0.0 --port ${FRONTEND_PORT} --strictPort"
    environment:
      TZ: ${APP_TIMEZONE}
      FRONTEND_PORT: ${FRONTEND_PORT}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      # Optional: keep direct frontend host access for debugging; primary access should go through nginx.
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      identity-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    environment:
      TZ: ${APP_TIMEZONE}
      FRONTEND_PORT: ${FRONTEND_PORT}
      IDENTITY_PORT: ${IDENTITY_PORT}
      COMMUNICATION_PORT: ${COMMUNICATION_PORT}
      LEARNING_PORT: ${LEARNING_PORT}
      AI_SERVICE_PORT: ${AI_SERVICE_PORT}
      MINIO_API_PORT: ${MINIO_API_PORT}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT}
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - frontend
      - identity-service
      - communication-service
      - learning-service
      - ai-service

volumes:
  mysql_data:
  postgres_ai_data:
  redis_data:
  minio_data:
